name: Playwright regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    name: Type check and Chromium regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Type check
        run: npm run typecheck

      - name: Run regression tests
        run: npm test

      - name: Upload Playwright report and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-and-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
